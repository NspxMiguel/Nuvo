<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e13" />
    <title>IAUnifier</title>
    <!-- iOS ignora o manifest pra tela cheia: precisa destas três. A quarta é
         a padrão, que o Chrome pede em lugar da variante apple- (e avisa no
         console em toda abertura enquanto ela não está aqui). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IAUnifier" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="scrim"></div>
      <aside id="sidebar">
        <header class="side-head">
          <span class="brand">IAUnifier</span>
          <button id="btn-close-side" class="icon" title="fechar" aria-label="fechar menu">
            <span data-icon="close"></span>
          </button>
        </header>

        <button id="btn-new-chat" class="primary block">
          <span data-icon="plus"></span> Nova conversa
        </button>

        <div class="side-search">
          <span data-icon="search"></span>
          <input id="side-search" type="search" placeholder="Buscar em tudo" />
        </div>

        <nav id="nav">
          <button data-view="chat" class="nav-item active"><span data-icon="chat"></span> Conversas</button>
          <button data-view="council" class="nav-item"><span data-icon="users"></span> Conselho</button>
          <button data-view="research" class="nav-item"><span data-icon="globe"></span> Pesquisa</button>
          <button data-view="projects" class="nav-item"><span data-icon="folder"></span> Projetos</button>
          <button data-view="gems" class="nav-item"><span data-icon="sparkle"></span> Gems</button>
          <button data-view="memory" class="nav-item"><span data-icon="brain"></span> Memória</button>
          <button data-view="providers" class="nav-item"><span data-icon="plug"></span> Provedores</button>
          <button data-view="settings" class="nav-item"><span data-icon="settings"></span> Config</button>
        </nav>

        <div id="chat-list"></div>

        <footer class="side-foot">
          <button id="btn-theme" class="icon" title="tema" aria-label="trocar entre tema claro e escuro">
            <span data-icon="moon"></span>
          </button>
          <button id="btn-palette" class="icon" title="paleta de comandos" aria-label="abrir a paleta de comandos">
            <span data-icon="command"></span>
          </button>
          <span id="side-status" class="muted"></span>
        </footer>
      </aside>

      <main id="main">
        <header id="topbar">
          <button id="btn-open-side" class="icon" title="menu" aria-label="abrir menu"><span data-icon="menu"></span></button>
          <select id="sel-model" title="modelo"></select>
          <select id="sel-gem" title="gem"></select>
          <select id="sel-project" title="projeto"></select>
          <span id="chat-title"></span>
          <span class="grow"></span>
          <button id="btn-web" class="icon toggle" aria-pressed="false" title="buscar na web nesta conversa" aria-label="buscar na web nesta conversa">
            <span data-icon="globe"></span>
          </button>
          <button id="btn-tune" class="icon" title="ajustes da conversa" aria-label="ajustes da conversa">
            <span data-icon="spark"></span>
          </button>
          <button id="btn-export" class="icon" title="exportar conversa" aria-label="exportar conversa">
            <span data-icon="download"></span>
          </button>
        </header>

        <section id="view-chat" class="view">
          <div id="tune" class="tune" hidden></div>
          <div id="messages"></div>
          <div id="attach-bar" class="attach-bar" hidden></div>
          <form id="composer">
            <button id="btn-attach" class="icon" type="button" title="anexar arquivo" aria-label="anexar arquivo">
              <span data-icon="paperclip"></span>
            </button>
            <button id="btn-mic" class="icon" type="button" title="ditar" aria-label="ditar">
              <span data-icon="mic"></span>
            </button>
            <textarea id="input" rows="1" placeholder="Fale com a IA"></textarea>
            <button id="btn-send" class="primary" type="submit" title="enviar" aria-label="enviar mensagem">
              <span data-icon="send"></span>
            </button>
            <button id="btn-stop" class="icon danger" type="button" title="parar" aria-label="parar a resposta" hidden>
              <span data-icon="stop"></span>
            </button>
          </form>
          <input id="file-input" type="file" multiple hidden />
        </section>

        <section id="view-council" class="view" hidden></section>
        <section id="view-research" class="view" hidden></section>
        <section id="view-projects" class="view" hidden></section>
        <section id="view-gems" class="view" hidden></section>
        <section id="view-memory" class="view" hidden></section>
        <section id="view-providers" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
      </main>
    </div>

    <div id="palette" class="palette" hidden>
      <div class="palette-box">
        <input id="palette-input" type="text" placeholder="O que você quer fazer?" />
        <div id="palette-list"></div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
